name: Deploy to GitHub Pages
on:
  # Chỉ chạy sau khi workflow "CI" (ci.yml) kết thúc trên main; điều kiện thành công kiểm ở `if` bên dưới.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run kích hoạt cả khi CI thất bại → chỉ deploy khi CI xanh (hoặc khi bấm chạy tay).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run chạy trên HEAD của main → phải checkout đúng commit mà CI vừa kiểm.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
